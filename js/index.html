<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body id="body">
    <button onclick="botonMsj()" id="btnMensaje">Mensaje</button>
    <span id="msjSpan"></span>

    <button onclick="btnColorFondo()">Cambiar color del fondo</button>


    <div id="contador">0</div>
    <button onclick="incrementar()" on>Sumar</button>
    <button onclick="decrementar()">Restar</button>


    <p class="parrafos">Parrafo</p>
    <p class="parrafos">Parrafo 2</p>
    <p class="parrafos">Parrafo 3</p>
    <button onclick="btnTextoParrafo()">Cambiar colores de los parrafos</button>

    <div>
        <button id="btnMostrarMsj" onclick="mostrarMsj()">Mostrar</button>
        <p id="msjOculto" style="display: none;">Mensaje oculto</p>
    </div>

    <div>
        <input type="text" id="inputTitulo" oninput="actualizarTitulo()">
        <h2 id="titulo"></h2>
    </div>

    <div>
        <p class="parrafosEjercicicio11">Parrafo 1</p>
        <p class="parrafosEjercicicio11">Parrafo 2</p>
        <p class="parrafosEjercicicio11">Parrafo 3</p>
        <button onclick="aplicarEstilos()">Cambiar color de fondo a los parrafos</button>
    </div>


    <div>
        <form>
            <input type="text" id="inputNombre" placeholder="Nombre">
            <input type="email" id="inputEmail" placeholder="Email">
            <button type="submit" onclick="validarForm(event)">Enviar</button>
            <p id="msjForm"></p>
        </form>
    </div>

    <div>
        <input type="text" id="inputTarea" placeholder="Ingrese una tarea">
        <button onclick="listaTareas()">Agregar</button>
        <ul id="listaTareas"></ul>
    </div>
</body>
<script src="./index.js"></script>

</html>
